<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Wine gradient background -->
    <linearGradient id="bgWine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B2024"/>
      <stop offset="55%" stop-color="#4A1518"/>
      <stop offset="100%" stop-color="#2D0C0E"/>
    </linearGradient>
    <!-- Warm highlight from top-right -->
    <radialGradient id="spot" cx="75%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#E0B080" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#C28B5B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6B2024" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft bottom shadow -->
    <linearGradient id="bottomShade" x1="0%" y1="60%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="630" fill="url(#bgWine)"/>
  <rect width="1200" height="630" fill="url(#spot)"/>
  <rect width="1200" height="630" fill="url(#bottomShade)"/>

  <!-- Subtle grain texture (decoration circles) -->
  <g opacity="0.06" fill="#F5F0E6">
    <circle cx="150" cy="120" r="1"/>
    <circle cx="320" cy="85" r="1.5"/>
    <circle cx="1050" cy="180" r="1"/>
    <circle cx="900" cy="540" r="1.2"/>
    <circle cx="240" cy="490" r="1"/>
    <circle cx="1100" cy="480" r="1"/>
  </g>

  <!-- Top bar: meta info -->
  <text x="72" y="86" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" fill="#F5F0E6" fill-opacity="0.55" letter-spacing="2.8">NO. 001 — TOKYO / 2026</text>
  <text x="1128" y="86" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" fill="#F5F0E6" fill-opacity="0.55" letter-spacing="2.8" text-anchor="end">DOCUMENTATION VOL.001</text>

  <!-- Top divider line -->
  <line x1="72" y1="110" x2="1128" y2="110" stroke="#F5F0E6" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Main wordmark "njoooy" with gold dot -->
  <g>
    <text x="600" y="340" font-family="'Fraunces', 'Playfair Display', 'Times New Roman', serif" font-size="200" font-style="italic" font-weight="300" fill="#F5F0E6" text-anchor="middle" letter-spacing="-6">njoooy</text>
    <!-- Gold dot after wordmark -->
    <circle cx="881" cy="314" r="11" fill="#E0B080"/>
  </g>

  <!-- Diamond divider -->
  <g transform="translate(600, 390)" stroke="#F5F0E6" stroke-opacity="0.35" stroke-width="1" fill="none">
    <line x1="-90" y1="0" x2="-16" y2="0"/>
    <path d="M -8 -6 L 0 0 L -8 6 L -16 0 Z" fill="#E0B080" fill-opacity="0.8" stroke="none"/>
    <line x1="16" y1="0" x2="90" y2="0"/>
  </g>

  <!-- Japanese subtitle -->
  <text x="600" y="446" font-family="'Shippori Mincho', 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="30" font-weight="500" fill="#F5F0E6" text-anchor="middle" letter-spacing="8">東京のバーテンダー</text>

  <!-- Service list -->
  <text x="600" y="496" font-family="'Shippori Mincho', 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="17" fill="#F5F0E6" fill-opacity="0.72" text-anchor="middle" letter-spacing="4">出張バー ・ メニュー開発 ・ 店舗相談 ・ 研修</text>

  <!-- Bottom divider line -->
  <line x1="72" y1="550" x2="1128" y2="550" stroke="#F5F0E6" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Bottom bar: URL + tagline -->
  <text x="72" y="584" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" fill="#F5F0E6" fill-opacity="0.55" letter-spacing="2.5">NJOOOY.COM</text>
  <text x="1128" y="584" font-family="'Shippori Mincho', 'Noto Serif JP', serif" font-size="13" fill="#F5F0E6" fill-opacity="0.55" text-anchor="end" letter-spacing="2" font-style="italic">Cocktail &amp; Non-Alc</text>
</svg>
